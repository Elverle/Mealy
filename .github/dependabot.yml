# Aggiornamenti di versione per l'immagine base e le GitHub Actions. Gli avvisi
# di sicurezza sui pacchetti npm arrivano già dalle impostazioni del repository.
version: 2
updates:
  # Node nel Dockerfile (il gate CI legge la versione da lì). I salti di versione
  # maggiore restano una scelta a mano: Node 26 non arriva da solo.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
