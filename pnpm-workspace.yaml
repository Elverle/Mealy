allowBuilds:
  esbuild: true
  unrs-resolver: true

# Avvisi di sicurezza su dipendenze transitive: next fissa postcss a 8.4.31,
# @esbuild-kit (via drizzle-kit, solo sviluppo) fissa esbuild a 0.18; vite e
# shell-quote restavano alla versione del lockfile anche con `pnpm update`.
overrides:
  next>postcss: ^8.5.28
  '@esbuild-kit/core-utils>esbuild': ^0.25.4
  vite@<7.3.7: ^7.3.7
  shell-quote@<1.12.0: ^1.12.0
