name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build image, push to GHCR
    # Runner nativo, senza emulazione: l'architettura dell'immagine è quella del runner.
    # Default arm64 (Raspberry Pi). Per un server amd64 imposta la variabile del repository
    # IMAGE_RUNNER=ubuntu-24.04 (Settings → Secrets and variables → Actions → Variables).
    runs-on: ${{ vars.IMAGE_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # ghcr.io/<proprietario del repository, in minuscolo>/mealy:sha-<commit>: lo stesso nome che
      # scripts/image-name.sh ricava sul server dal remote origin. Funziona così anche in un fork.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mealy:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - run: docker build --build-arg "SOURCE_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$IMAGE" .

      # L'immagine viene provata prima di essere pubblicata.
      - run: bash scripts/smoke-prod.sh "$IMAGE"

      - name: Log in to GHCR
        # Token e utente passano dall'ambiente, non dal testo del comando.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - run: docker push "$IMAGE"
